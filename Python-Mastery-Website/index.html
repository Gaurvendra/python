<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Python Mastery: a structured Python course — 158 notebooks, from first print() to advanced Pydantic and asyncio." />
  <title>Python Mastery</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>" />
  <script>
    // Apply saved theme before paint to avoid a flash.
    try { document.documentElement.dataset.theme = localStorage.getItem("pm-theme") || "light"; } catch (e) {}
  </script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <button id="menu" class="icon-btn" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
    <a class="brand" href="#/">🐍 Python Mastery</a>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search lessons…" aria-label="Search lessons" />
    </div>
    <label class="theme-label">
      <span class="sr-only">Theme</span>
      <select id="theme" aria-label="Theme">
        <option value="light">☀️ Light</option>
        <option value="dark">🌙 Dark</option>
        <option value="sepia">📜 Sepia</option>
        <option value="midnight">🌌 Midnight</option>
      </select>
    </label>
  </header>

  <div class="layout">
    <nav id="sidebar" class="sidebar" aria-label="Course navigation"></nav>
    <div class="backdrop" id="backdrop"></div>
    <main id="content" class="content" tabindex="-1">
      <p class="loading">Loading…</p>
    </main>
  </div>

  <div class="progress-bar" aria-hidden="true"><span id="progress"></span></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
